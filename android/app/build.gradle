plugins {
    id 'com.android.application'
}

android {
    namespace 'it.mirkoori.palcotimer'
    compileSdk 36

    defaultConfig {
        applicationId 'it.mirkoori.palcotimer'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    // Chiave di prova, nel repository: serve solo a far installare gli aggiornamenti sopra la versione precedente
    // durante i test. Per il Play Store si userà una chiave privata vera (non in questo repository).
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    // Pacchetto per il Play Store: firmato con la chiave di caricamento, passata dal workflow tramite variabili d'ambiente.
    // Se mancano (build locale o di prova) si usa la chiave di prova.
    def uploadStore = System.getenv('UPLOAD_KEYSTORE')
    if (uploadStore) {
        signingConfigs {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig uploadStore ? signingConfigs.upload : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Le pagine dell'app sono la cartella public/ della radice: stessi file del sito e dell'app per computer.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../public']
        }
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:7.1.1'
}
