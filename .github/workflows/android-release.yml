name: App Android per il Play Store

# Costruisce il pacchetto .aab firmato con la chiave di caricamento (segreti del repository):
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
# Si avvia a mano: Actions → "App Android per il Play Store" → Run workflow.
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - run: npm ci
      - run: npm test

      - name: Chiave di caricamento
        env:
          B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$B64" ]; then echo "Manca il segreto UPLOAD_KEYSTORE_BASE64"; exit 1; fi
          echo "$B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Costruisci il pacchetto
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle -p android bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: palco-timer-playstore
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
